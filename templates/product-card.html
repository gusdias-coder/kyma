{% load shop_tags %}<article class="product-card"><a href="{% url 'product' product.slug %}" class="product-image"><img src="{{ product|image_url }}" alt="{{ product.name }}{% if product.demo %}, fotografia de referência{% endif %}" width="400" height="500" loading="lazy">{% if product.demo %}<span class="sample-badge">DEMONSTRAÇÃO</span>{% endif %}<span class="product-arrow" aria-hidden="true">↗</span></a><div class="product-info"><h3><a href="{% url 'product' product.slug %}">{{ product.name }}</a></h3><p>{{ product.category.name }}</p><strong>{{ product.price|money }}</strong>{% with variants=product|purchasable_variants %}{% if variants %}<form class="quick-add" method="post" action="{% url 'cart_update' %}" data-track="add_to_cart">{% csrf_token %}<input type="hidden" name="action" value="add"><input type="hidden" name="quantity" value="1"><label class="sr-only" for="quick-variant-{{ product.pk }}">Tamanho e cor de {{ product.name }}</label><select name="variant" id="quick-variant-{{ product.pk }}" required><option value="">Tamanho e cor</option>{% for variant in variants %}<option value="{{ variant.pk }}">{{ variant.size }} · {{ variant.color }}</option>{% endfor %}</select><button class="button full" type="submit">Adicionar ao carrinho <span>+</span></button></form>{% else %}<p class="stock-unavailable">Esgotado no momento</p>{% endif %}{% endwith %}<a class="product-detail" href="{% url 'product' product.slug %}">Ver detalhes →</a></div></article>
